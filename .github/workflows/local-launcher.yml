# Responsibility: Verify platform boundaries and native-process behavior of the local launcher on Windows, macOS, and Linux.
# Implementation: Run Python standard-library tests; POSIX creates an empty dependency test environment through system Bash, while Windows validates PowerShell syntax.
# Relationships: local_server.py, test_local_server.py, start-local.ps1, and start-local.sh. It does not read business credentials or start real business services.
# Directory:
# - launcher: Platform-matrix job.
# Variable index:
# - matrix.os: Selects host.
# - matrix.python-version: Validates Python 3.11 and 3.12.
# - parseErrors/parseTokens: Receive PowerShell parser results.
# - contents: Read-only checkout permission.
name: Local launcher
on:
  pull_request:
    paths:
      - 'start-local.*'
      - 'backend/tools/local_server.py'
      - 'backend/tools/test_local_server.py'
      - '.github/workflows/local-launcher.yml'
  push:
    branches: [main, master]
    paths:
      - 'start-local.*'
      - 'backend/tools/local_server.py'
      - 'backend/tools/test_local_server.py'
      - '.github/workflows/local-launcher.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Bash syntax
        if: runner.os != 'Windows'
        run: /bin/bash -n start-local.sh
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/start-local.ps1", [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Test locks, signals, sessions and shell setup
        run: python -X utf8 backend/tools/test_local_server.py
