# 职责：主分支提交直接触发 Lightsail 部署，隔离测试独立报告诊断结果。
# 实现：verify 与 deploy 无依赖并行运行；诊断失败不阻断或取消部署，PR 只运行诊断；main 推送或手动运行才部署。
# 关联：服务器受限 SSH 入口与 root 部署脚本；只读 Git deploy key 留在服务器。
# 目录：verify 执行非阻断诊断，deploy 独立触发并等待服务器发布。
# 变量索引：DATABASE_URL/DJANGO_SECRET_KEY 为 CI 合成配置；RELEASE_SHA 为本次 main 提交；
# DEPLOY_KEY/DEPLOY_HOST_KEY 为 GitHub 加密 secrets，前者只允许受限触发，后者固定服务器身份。
# CELERY_BROKER_URL/CELERY_RESULT_BACKEND 为 CI Redis 地址；celery_pid 为临时消费者 PID。
# backend_test_modules/agent_test_modules 为排除已禁用 QQ 集成的测试模块列表。
# SALESMATE_PLAYWRIGHT_MODULE/SALESMATE_BROWSER_PATH 指向 RUNNER_TEMP 中的隔离浏览器运行时。
# RUNNER_TEMP/salesmate-tools-sdk 为工具 SDK 隔离环境，不改变 Web/Worker 依赖。
# CHECK_STATUS 为诊断任务结果，仅写入摘要，不参与部署条件。
name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    name: Advisory checks (does not block deployment)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: salesmate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: salesmate
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.0
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://salesmate:ci-only-password@127.0.0.1:5432/salesmate?connect_timeout=3
      DJANGO_SECRET_KEY: ci-only-isolated-tests-no-production-credentials-2026
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_TIME_ZONE: UTC
      ANALYSIS_PROVIDER: rules
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            agent/requirements.txt
      - name: Install isolated test dependencies
        run: python -m pip install -r backend/requirements/base.txt -r agent/requirements.txt
      - name: Verify compiled interface translations
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          msgfmt --check -o "$RUNNER_TEMP/django.mo" backend/locale/en/LC_MESSAGES/django.po
          cmp "$RUNNER_TEMP/django.mo" backend/locale/en/LC_MESSAGES/django.mo
      - name: Check source documentation and deployment scripts
        run: |
          python backend/tools/check_docs.py
          python backend/tools/check_docs.py integrations
          python backend/tools/test_check_docs.py
          python backend/tools/test_check_doc_changes.py
          bash -n backend/deploy/lightsail/deploy-from-git.sh
          bash -n backend/deploy/lightsail/deploy-trigger.sh
          bash -n deploy/lightsail/bootstrap-infrastructure.sh
      - name: Run backend and Agent tests without disabled QQ integration
        run: |
          mapfile -t backend_test_modules < <(find backend/tests -type f -name 'test_*.py' ! -name 'test_qq_*.py' -printf '%p\n' | sed -e 's#^backend/##' -e 's#/#.#g' -e 's/\.py$//' | sort)
          python backend/manage.py test "${backend_test_modules[@]}" --noinput
          mapfile -t agent_test_modules < <(find agent/tests -maxdepth 1 -name 'test_*.py' ! -name 'test_qq_mail.py' -printf 'agent.tests.%f\n' | sed 's/\.py$//' | sort)
          python -m unittest "${agent_test_modules[@]}"
          python backend/manage.py makemigrations --check --dry-run
      - name: Verify standalone business CLI and MCP protocol
        run: |
          python -m venv "$RUNNER_TEMP/salesmate-tools-sdk"
          "$RUNNER_TEMP/salesmate-tools-sdk/bin/python" -m pip install -r integrations/salesmate_tools/requirements.txt
          "$RUNNER_TEMP/salesmate-tools-sdk/bin/python" -m unittest discover -s integrations/salesmate_tools/tests -v
      - name: Verify actual Redis and Celery roundtrip
        run: |
          export TASK_EXECUTION_MODE=celery
          export DJANGO_SETTINGS_MODULE=config.settings.local
          export PYTHONPATH="$PWD/backend:$PWD"
          python backend/manage.py migrate --noinput
          python -m celery -A config.celery:app worker --pool=solo --queues=crm,sales --loglevel=WARNING > "$RUNNER_TEMP/celery.log" 2>&1 &
          celery_pid=$!
          trap 'kill -TERM "$celery_pid"; wait "$celery_pid"' EXIT
          python backend/manage.py check_infrastructure --workers
      - name: Check Gmail test tool preview
        run: |
          python test_tools/gmail_test_injector.py --dry-run
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/salesmate-browser" playwright@1.62.1
          "$RUNNER_TEMP/salesmate-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify active browser flows with mocked APIs
        run: |
          export SALESMATE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/salesmate-browser/node_modules/playwright"
          export SALESMATE_BROWSER_PATH="$(node -e 'console.log(require(process.env.SALESMATE_PLAYWRIGHT_MODULE).chromium.executablePath())')"
          # QQ 专用浏览器检查保持禁用；聊天和邮件处理使用模拟接口验证当前页面契约。
          node backend/tools/browser_chat.cjs
          node backend/tools/browser_processing.cjs
          node backend/tools/browser_workspace.cjs
          node backend/tools/browser_world_news.cjs
          node backend/tools/browser_i18n.cjs
          python backend/manage.py test tools.chat_browser_e2e --noinput

      - name: Summarize advisory checks
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: |
          echo "## Advisory checks" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: $CHECK_STATUS. See this job log for failed or skipped checks." >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment runs independently; these checks never gate publication." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: salesmate-production
      cancel-in-progress: false
    steps:
      - name: Pull and deploy the main commit on Lightsail
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_KEY: ${{ secrets.LIGHTSAIL_DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.LIGHTSAIL_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && -n "$DEPLOY_KEY" && -n "$DEPLOY_HOST_KEY" ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            salesmate-deploy@47.131.232.143 "$RELEASE_SHA"
