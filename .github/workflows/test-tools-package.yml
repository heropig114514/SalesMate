# Responsibility: Verify Gmail and QQ test-mail tools and create a standalone download package containing both.
# Implementation: Run offline tests, documentation checks, and both dry runs; copy only public files, reverify in the package directory, then upload the artifact.
# Relationships: Gmail/QQ injector scripts, templates, and documentation in test_tools. QQ writes a mailbox only with explicit --apply.
# Directory:
# - package-test-tools: Packaging job.
# Variable index:
# - package_dir: Fixed distribution directory.
# - Pipeline: Does not read mailbox authorization codes or OAuth tokens.
name: Package test tools

on:
  push:
    branches: [main]
    paths:
      - 'test_tools/**'
      - '.github/workflows/test-tools-package.yml'
  pull_request:
    paths:
      - 'test_tools/**'
      - '.github/workflows/test-tools-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-test-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: test_tools/requirements.txt

      - name: Install standalone dependencies
        run: python -m pip install -r test_tools/requirements.txt

      - name: Test QQ injector without mailbox access
        run: python -m unittest discover -s test_tools/tests -v

      - name: Check QQ tool documentation
        run: python backend/tools/check_docs.py test_tools/qq_test_injector.py test_tools/tests/test_qq_test_injector.py

      - name: Preview Gmail and QQ test messages
        run: |
          python test_tools/gmail_test_injector.py --dry-run
          python test_tools/qq_test_injector.py --dry-run

      - name: Build package directory
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/SalesMate-test-tools"
          mkdir -p "$package_dir"
          cp test_tools/README.md "$package_dir/"
          cp test_tools/requirements.txt "$package_dir/"
          cp test_tools/gmail_test_injector.py "$package_dir/"
          cp test_tools/gmail_test_messages.template.json "$package_dir/"
          cp test_tools/qq_test_injector.py "$package_dir/"
          cp test_tools/qq_test_messages.template.json "$package_dir/"
          cp test_tools/QQ_README.md "$package_dir/"

      - name: Verify packaged tools in isolation
        working-directory: dist/SalesMate-test-tools
        run: |
          python -I gmail_test_injector.py --dry-run
          python -I qq_test_injector.py --dry-run

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: salesmate-test-tools
          path: dist/SalesMate-test-tools/
          if-no-files-found: error
          retention-days: 30
