# Responsibility: Validate backend and integrations Python documentation structure and report change-review findings for every PR or main-branch update.
# Implementation: Use complete Git history, standard-library checkers, and isolated tests without installing business dependencies or starting external services.
# Relationships: backend/tools/check_docs.py, check_doc_changes.py, and their tests.
# Directory:
# - backend-docs: Check job.
# Variable index:
# - DOC_BASE: PR base or pre-push commit; initial pushes and manual runs self-compare against the current commit.
name: Backend documentation
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all backend Python documentation
        working-directory: backend
        run: python tools/check_docs.py
      - name: Test documentation checkers
        working-directory: backend
        run: |
          python tools/test_check_docs.py
          python tools/test_check_doc_changes.py
      - name: Check integration client documentation
        run: python backend/tools/check_docs.py integrations
      - name: Report code and documentation changes
        env:
          DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        shell: bash
        run: |
          if [[ "$DOC_BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "Initial push: structural checks apply; no previous commit for comparison."
            DOC_BASE="$GITHUB_SHA"
          fi
          python backend/tools/check_doc_changes.py --base "$DOC_BASE"
