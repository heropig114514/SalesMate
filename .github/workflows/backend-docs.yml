# 职责：每次 PR 或主分支更新时验证 backend Python 注释结构并列出变更复核项。
# 实现：完整 Git 历史、标准库检查器和隔离测试；不安装业务依赖或启动外部服务。
# 关联：backend/tools/check_docs.py、check_doc_changes.py 及各自测试。
# 目录：backend-docs 检查任务；无函数或类。
# 变量索引：DOC_BASE 为 PR 基准或推送前提交；首次推送及手动执行以当前提交自比较。
name: Backend documentation
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all backend Python documentation
        working-directory: backend
        run: python tools/check_docs.py
      - name: Test documentation checkers
        working-directory: backend
        run: |
          python tools/test_check_docs.py
          python tools/test_check_doc_changes.py
      - name: Report code and documentation changes
        env:
          DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        shell: bash
        run: |
          if [[ "$DOC_BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "Initial push: structural checks apply; no previous commit for comparison."
            DOC_BASE="$GITHUB_SHA"
          fi
          python backend/tools/check_doc_changes.py --base "$DOC_BASE"
