            type: string
            maxLength: 100
        time_zone:
          type: string
          nullable: true
          maxLength: 100
    SellerProfileResponse:
      type: object
      properties:
        revision:
          type: integer
        profile:
          $ref: '#/components/schemas/SellerProfile'
      required:
      - profile
      - revision
    SignalEnum:
      enum:
      - repeat_purchase
      - quoted_not_closed
      - inquiry_intent
      - new_lead_no_profile
      - unknown
      type: string
      description: |-
        * `repeat_purchase` - repeat_purchase
        * `quoted_not_closed` - quoted_not_closed
        * `inquiry_intent` - inquiry_intent
        * `new_lead_no_profile` - new_lead_no_profile
        * `unknown` - unknown
    Simulate:
      type: object
      properties:
        mailbox_id:
          type: string
          format: uuid
        sender:
          type: string
          format: email
        subject:
          type: string
          maxLength: 1000
        body_text:
          type: string
          maxLength: 200000
      required:
      - body_text
      - mailbox_id
      - sender
      - subject
    SizeBandEnum:
      enum:
      - lt_50
      - '50_100'
      - '100_200'
      - '200_500'
      - gte_500
      - unknown
      type: string
      description: |-
        * `lt_50` - lt_50
        * `50_100` - 50_100
        * `100_200` - 100_200
        * `200_500` - 200_500
        * `gte_500` - gte_500
        * `unknown` - unknown
    SizeRange:
      type: object
      properties:
        min:
          type: integer
          minimum: 0
        max:
          type: integer
          minimum: 0
      required:
      - max
      - min
    SourceEnum:
      enum:
      - gmail_real
      - qq_real
      - synthetic_sample
      - research_dataset
      - simulated
      type: string
      description: |-
        * `gmail_real` - gmail_real
        * `qq_real` - qq_real
        * `synthetic_sample` - synthetic_sample
        * `research_dataset` - research_dataset
        * `simulated` - simulated
    SubmissionResult:
      type: object
      properties:
        dedupe_key:
          type: string
        company_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SubmissionResultStatusEnum'
      required:
      - company_id
      - dedupe_key
      - status
    SubmissionResultStatusEnum:
      enum:
      - created
      - updated
      - duplicate
      type: string
      description: |-
        * `created` - created
        * `updated` - updated
        * `duplicate` - duplicate
    SyncRequest:
      type: object
      properties:
        sync_options:
          $ref: '#/components/schemas/MailboxSyncOptions'
      required:
      - sync_options
    SyncState:
      type: object
      properties:
        mailbox_id:
          type: string
          format: uuid
        cursor:
          type: string
          nullable: true
        scope:
          type: object
          additionalProperties: {}
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/SyncStateStatusEnum'
        version:
          type: integer
          minimum: 0
      required:
      - cursor
      - last_synced_at
      - mailbox_id
      - scope
      - status
      - version
    SyncStateStatusEnum:
      enum:
      - ok
      - resync_required
      - authorization_required
      type: string
      description: |-
        * `ok` - ok
        * `resync_required` - resync_required
        * `authorization_required` - authorization_required
  securitySchemes:
    agentCredential:
      type: apiKey
      in: header
      name: Authorization
      description: Agent <service-token>; never a Gmail token.
    businessToolCredential:
      type: apiKey
      in: header
      name: Authorization
      description: Tool <user-scoped-token>
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
