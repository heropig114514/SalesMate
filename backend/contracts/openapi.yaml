    get:
      operationId: v1_accounts_company_profile_retrieve
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
          description: ''
    patch:
      operationId: v1_accounts_company_profile_partial_update
      parameters:
      - in: header
        name: If-Match
        schema:
          type: integer
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompanyProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompanyProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompanyProfile'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
