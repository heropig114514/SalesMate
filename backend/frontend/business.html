<!DOCTYPE html>

<!-- 职责：销售业务管理页的语义骨架。
实现：workspace.js 提供工作台、Channels、客户及四类业务导航与客户上下文；business.js 渲染带 URL 筛选及共享实验只读标记的列表、受服务端开关控制的 QQ 发信连接及动作确认表单。
关联：入口缓存版本同步顶栏实验入口移除；入口脚本同步商机优先级导航缓存版本；聊天 Markdown 模块依赖使用统一缓存版本；0919 界面及共享语言资源统一缓存版本；0919 产品精简去除重复全局待办栏；共享语言/API 资源随需求界面统一版本；入口脚本版本随工作空间聊天升级；assistant-widget.js/css 提供底部条状助手；product-header.js 提供共享顶栏，design-system.css 提供 Nocturne 设计变量；复用现有会话登录及销售 API；business.css 提供独立响应式布局。
目录：无函数或类；workspace-profile 为底部公司、邮箱设置及账号内部数据清空入口，workspace-nav 为共享导航，workspace-context 为当前客户，status-filter 为状态筛选；editor 是编辑及动作确认对话框。
国际化：data-i18n 标记静态文本与属性；language-bar 提供语言选择，i18n.js 初始化时只翻译标记节点，选项显式 value 保持原协议值。
变量索引：无脚本变量；DOM id 供业务模块定位。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title data-i18n="SalesMate · 业务管理">SalesMate · 业务管理</title>
<link href="/static/design-system.css?v=20260921-product" rel="stylesheet"/>
<link href="/static/business.css?v=20260920-i18n" rel="stylesheet"/>
<link href="/static/assistant-widget.css?v=20260921-markdown" rel="stylesheet"/>
<link href="/static/workspace.css?v=20260921-product" rel="stylesheet"/>
<script type="module" src="/static/i18n.js?v=20260921-product"></script></head>
<body class="business-workspace"><div class="language-bar"><label for="interface-language"><span data-i18n="界面语言">界面语言</span></label><select aria-label="界面语言" data-i18n-aria-label="界面语言" id="interface-language"><option data-i18n="跟随系统" value="auto">跟随系统</option><option value="zh-hans">简体中文</option><option value="en">English</option></select></div>
<salesmate-header></salesmate-header>
<aside class="workspace-shell"><div class="workspace-brand-label">WORKSPACE<span><span data-i18n="我的工作空间">我的工作空间</span></span></div><nav aria-label="主导航" data-i18n-aria-label="主导航" id="workspace-nav"></nav><nav class="workspace-profile" aria-label="Profile" id="workspace-profile"></nav><div class="account" id="account"><span data-i18n="正在读取会话…">正在读取会话…</span></div></aside>
<main>
<header class="workspace-topbar">
<div>
<p class="eyebrow"><span data-i18n="工作空间 / 销售业务">工作空间 / 销售业务</span></p>
<h1 id="page-title"><span data-i18n="业务概览">业务概览</span></h1>
</div>

</header><section aria-label="当前客户" class="workspace-context" data-i18n-aria-label="当前客户" hidden="" id="workspace-context"></section>
<div hidden="" id="business-notice" role="alert"></div>
<p class="workspace-page-intro"><span data-i18n="工作空间概览 · 以下统计覆盖全部可见客户">工作空间概览 · 以下统计覆盖全部可见客户</span></p>
<section aria-label="业务概览" class="stats" data-i18n-aria-label="业务概览" id="business-stats"></section>
<section class="surface">
<div class="toolbar">
<div>
<h2 id="list-title"><span data-i18n="客户目录">客户目录</span></h2>
<p id="list-description"><span data-i18n="管理客户关系、交易与下一次跟进。">管理客户关系、交易与下一次跟进。</span></p>
</div>
<div class="actions">
<button id="refresh-business" type="button"><span data-i18n="刷新">刷新</span></button><button class="primary" id="create-business" type="button"><span data-i18n="新建">
              新建
            </span></button>
</div>
</div>
<div class="filters">
<label><span data-i18n="当前客户">当前客户</span><select id="company-filter">
<option data-i18n="全部客户" value="">全部客户</option>
</select></label><label hidden="" id="status-filter-label"><span data-i18n="状态">状态</span><select class="workspace-filter-status" id="status-filter"><option data-i18n="全部状态" value="">全部状态</option></select></label><label class="check"><input id="include-archived" type="checkbox"/><span data-i18n="包含已归档">包含已归档</span></label><span id="record-count"></span>
</div>
<div aria-live="polite" id="business-content"><span data-i18n="正在加载…">正在加载…</span></div>
<div class="pagination" id="business-pagination"></div>
</section>
<p class="footnote"><span data-i18n="确认订单净额按币种分别统计。外部发送须先准备内容、人工确认，再由销售任务进程执行。">
        确认订单净额按币种分别统计。外部发送须先准备内容、人工确认，再由销售任务进程执行。
      </span></p>
</main>
<dialog aria-labelledby="editor-title" id="editor">
<div class="dialog-top">
<h2 id="editor-title"><span data-i18n="编辑记录">编辑记录</span></h2>
<button aria-label="关闭编辑" data-i18n-aria-label="关闭编辑" id="close-editor" type="button">×</button>
</div>
<div hidden="" id="editor-error" role="alert"></div>
<div id="editor-body"></div>
</dialog>
<script type="module" src="/static/business.js?v=20260922-nav"></script>
</body>
</html>
