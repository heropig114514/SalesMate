<!doctype html>
<!-- 职责：销售业务管理页的语义骨架。
实现：workspace.js 提供共享导航与客户上下文；business.js 渲染带 URL 筛选的列表、受服务端开关控制的 QQ 发信连接及动作确认表单。
关联：复用现有会话登录及销售 API；business.css 提供独立响应式布局。
目录：无函数或类；workspace-nav 为共享导航，workspace-context 为当前客户，status-filter 为状态筛选；editor 是编辑及动作确认对话框。
变量索引：无脚本变量；DOM id 供业务模块定位。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SalesMate · 业务管理</title>
    <link rel="stylesheet" href="/static/business.css?v=20260913-unified" />
  <link rel="stylesheet" href="/static/workspace.css?v=20260913-unified" />
  </head>
  <body class="business-workspace">
    <aside class="workspace-shell"><a class="brand" href="/#home"><span class="brand-mark">S</span><span>SalesMate<small>销售工作空间</small></span></a><nav id="workspace-nav" aria-label="主导航"></nav><div class="account" id="account">正在读取会话…</div></aside>
    <main>
      <header class="workspace-topbar">
        <div>
          <p class="eyebrow">工作空间 / 销售业务</p>
          <h1 id="page-title">业务概览</h1>
        </div>
        <a href="/#home">返回工作台</a>
      </header><div id="workspace-status" class="workspace-status" aria-label="全局待办">正在读取待办…</div><p id="workspace-load-error" class="workspace-load-error" role="alert" hidden></p><section id="workspace-context" class="workspace-context" aria-label="当前客户" hidden></section>
      <div id="business-notice" role="alert" hidden></div>
      <p class="workspace-page-intro">工作空间概览 · 以下统计覆盖全部可见客户</p>
      <section
        id="business-stats"
        class="stats"
        aria-label="业务概览"
      ></section>
      <section class="surface">
        <div class="toolbar">
          <div>
            <h2 id="list-title">客户目录</h2>
            <p id="list-description">管理客户关系、交易与下一次跟进。</p>
          </div>
          <div class="actions">
            <button id="refresh-business" type="button">刷新</button
            ><button id="create-business" class="primary" type="button">
              新建
            </button>
          </div>
        </div>
        <div class="filters">
          <label
            >当前客户<select id="company-filter">
              <option value="">全部客户</option>
            </select></label
          ><label id="status-filter-label" hidden>状态<select id="status-filter" class="workspace-filter-status"><option value="">全部状态</option></select></label><label class="check"
            ><input id="include-archived" type="checkbox" />包含已归档</label
          ><span id="record-count"></span>
        </div>
        <div id="business-content" aria-live="polite">正在加载…</div>
        <div id="business-pagination" class="pagination"></div>
      </section>
      <p class="footnote">
        确认订单净额按币种分别统计。外部发送须先准备内容、人工确认，再由销售任务进程执行。
      </p>
    </main>
    <dialog id="editor" aria-labelledby="editor-title">
      <div class="dialog-top">
        <h2 id="editor-title">编辑记录</h2>
        <button id="close-editor" type="button" aria-label="关闭编辑">×</button>
      </div>
      <div id="editor-error" role="alert" hidden></div>
      <div id="editor-body"></div>
    </dialog>
    <script type="module" src="/static/business.js?v=20260919-qq-paused"></script>
  </body>
</html>
