<!DOCTYPE html>
<!-- 职责：四步基础信息与本公司资料页面的语义骨架。
实现：共享主导航和底部 Profile；认证成功后读取当前账号资料，用户显式保存。
关联：入口缓存同步侧栏优先级移除；入口缓存版本同步顶栏实验入口移除；入口脚本同步商机优先级导航缓存版本；资料条目标识支持使用新资源版本；聊天 Markdown 模块依赖使用统一缓存版本；0919 界面及共享语言资源统一缓存版本；共享语言/API 资源随需求界面统一版本；入口脚本版本随工作空间聊天升级；company-settings.js/css、workspace.js/css、accounts/company-profile API 和底部助手。
目录：无函数或类；setup-root 为引导容器；company-step 为第二步，company-form 为资料表单，company-controls 控制忙碌状态，company-fields 为字段，company-status 显示保存和错误状态。
变量索引：无脚本变量；DOM id 由页面控制器引用。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Company Setting · SalesMate</title>
<link rel="stylesheet" href="/static/design-system.css?v=20260921-product">
<link rel="stylesheet" href="/static/business.css?v=20260920-i18n">
<link rel="stylesheet" href="/static/workspace.css?v=20260921-product">
<link rel="stylesheet" href="/static/assistant-widget.css?v=20260921-markdown">
<link rel="stylesheet" href="/static/company-settings.css?v=20260920-profile">
<link rel="stylesheet" href="/static/onboarding.css?v=20260920-requirements">
<script type="module" src="/static/i18n.js?v=20260921-product"></script>
</head>
<body class="business-workspace">
<div class="language-bar"><label for="interface-language" data-i18n="界面语言">界面语言</label><select id="interface-language" aria-label="界面语言" data-i18n-aria-label="界面语言"><option value="auto" data-i18n="跟随系统">跟随系统</option><option value="zh-hans">简体中文</option><option value="en">English</option></select></div>
<salesmate-header></salesmate-header>
<aside class="workspace-shell">
<div class="workspace-brand-label">WORKSPACE<span data-i18n="我的工作空间">我的工作空间</span></div>
<nav id="workspace-nav" aria-label="主导航" data-i18n-aria-label="主导航"></nav>
<nav id="workspace-profile" class="workspace-profile" aria-label="Profile"></nav>
<div class="account" id="account"></div>
</aside>
<main>
<header class="workspace-topbar"><div><p class="eyebrow">PROFILE</p><h1 data-i18n="基础信息">基础信息</h1></div></header>
<div id="setup-root"></div>
<section id="company-step" class="company-settings-card" aria-label="Company Setting">
<p id="company-description"></p>
<form id="company-form"><fieldset id="company-controls" disabled><div id="company-fields"></div><div class="company-settings-actions"><button id="company-save" class="primary" type="submit" disabled>保存修改</button><button id="company-reload" type="button">重新读取</button></div></fieldset></form>
<p id="company-status" role="status" aria-live="polite"></p>
</section>
</main>
<script type="module" src="/static/company-settings.js?v=20260922-sidebar"></script>
</body>
</html>
