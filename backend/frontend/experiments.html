<!doctype html>
<!-- Responsibility: Provide a synthetic experiment-data browser readable by all authenticated users within the existing site.
Implementation: experiments.js loads catalogs, ownership, fields, and foreign keys, supporting search, pagination, downloads, and relation navigation.
Relationships: Entry versions reflect experiment-entry removal; reuse product-header and sessions. Experiment APIs verify exact batches independently; maintenance uses the shared Tool API.
Directory: No functions or classes; experiment-tables holds the catalog, experiment-rows the record list, and record-dialog the details.
Variable index: None; DOM ids serve only as script lookup points. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SalesMate · 实验数据</title>
  <link rel="stylesheet" href="/static/design-system.css?v=20260921-product">
  <link rel="stylesheet" href="/static/experiments.css?v=20260921-kg-write">
</head>
<body>
  <salesmate-header></salesmate-header>
  <main class="experiment-shell">
    <header class="experiment-heading"><div><p class="eyebrow">KNOWLEDGE GRAPH LAB</p><h1>实验数据</h1><p>跨账号查看业务记录与 AI 生成链路，原始归属保持可见。</p></div>
      <a id="export-batch" hidden>下载完整 JSON</a></header>
    <p id="experiment-status" role="status" aria-live="polite">正在读取实验目录…</p>
    <p id="login-link" hidden><a href="/">前往工作台登录</a>，登录后返回本页。</p>
    <section id="experiment-content" hidden>
      <div class="experiment-banner"><span>虚构数据 · 全体登录账号可读 · 业务记录可新增、修改、删除</span><span id="batch-owner"></span><span id="batch-name"></span></div>
      <p class="muted" id="experiment-notice"></p>
      <div class="experiment-layout">
        <aside><h2>数据表 <span id="table-count"></span></h2><nav id="experiment-tables" aria-label="实验数据表"></nav></aside>
        <section class="experiment-panel">
          <div class="panel-heading"><div><h2 id="table-title"></h2><p class="muted" id="table-name"></p></div><div><span id="row-count"></span> <button id="create-record" type="button" hidden>新增共享虚构记录</button></div></div>
          <form id="experiment-filter"><label>搜索内容<input id="search-query" type="search" placeholder="客户名、邮件内容或主键"></label><label>归属账号<input id="owner-query" placeholder="例如 tst1"></label><button type="submit">搜索</button><button type="button" id="clear-filter">清除筛选</button></form>
          <div class="table-scroll"><table><thead><tr><th>记录</th><th>归属</th><th>主键</th><th>操作</th></tr></thead><tbody id="experiment-rows"></tbody></table></div>
          <div class="experiment-pagination"><button id="previous-page" type="button">上一页</button><span id="page-label"></span><button id="next-page" type="button">下一页</button></div>
          <details><summary>字段与关系结构</summary><pre id="table-schema"></pre></details>
        </section>
      </div>
    </section>
  </main>
  <dialog id="record-dialog" aria-labelledby="record-title"><div class="panel-heading"><h2 id="record-title">记录详情</h2><button id="close-record" type="button">关闭</button></div><p id="record-owner"></p><div id="record-links"></div><a id="record-download" hidden>下载文件</a><div><button id="edit-record" type="button" hidden>修改记录</button> <button id="delete-record" type="button" hidden>删除记录</button></div><pre id="record-json"></pre></dialog>
  <dialog id="editor-dialog" aria-labelledby="editor-title"><div class="panel-heading"><h2 id="editor-title"></h2><button id="close-editor" type="button">取消</button></div><p id="editor-status" role="status"></p><form id="editor-form"><div id="editor-fields"></div><button id="save-record" type="submit">保存共享记录</button></form></dialog>
  <script type="module" src="/static/experiments.js?v=20260922-nav"></script>
</body>
</html>
