<!doctype html>
<!-- 职责：提供世界行业消息地图、摘要侧栏和独立详情地址的页面骨架。
实现：Leaflet 绘制本地地图，world-news.js 管理筛选、选择与浏览历史；演示状态始终明确展示。
关联：world-feed.js 校验消息；world-map.js 绘制气泡；Django 的 /world/ 与 /world/news/<id>/ 共用模板。
目录：无函数或类；world-map 地图、news-panel 摘要、news-detail 详情、world-status 无障碍状态、world-error 错误提示。
变量索引：无脚本变量；行业筛选与统计 DOM 由页面模块维护。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><title>世界消息 · SalesMate</title>
  <link rel="stylesheet" href="/static/app.css?v=20260914-qq">
  <link rel="stylesheet" href="/static/workspace.css?v=20260913-unified">
  <link rel="stylesheet" href="/static/vendor/leaflet-1.9.4/leaflet.css">
  <link rel="stylesheet" href="/static/world-news.css?v=20260919">
  <script defer src="/static/vendor/leaflet-1.9.4/leaflet.js"></script>
  <script type="module" src="/static/world-news.js?v=20260919"></script>
</head>
<body class="world-workspace">
  <a class="world-skip" href="#world-content">跳到世界消息</a>
  <aside class="workspace-shell">
    <a href="/#home" class="brand"><span class="brand-mark">S</span><span>SalesMate<small>销售工作空间</small></span></a>
    <nav id="workspace-nav" aria-label="主导航"></nav>
    <div class="world-sidebar-note"><span class="world-orbit" aria-hidden="true">◎</span><strong>让每条消息，有业务坐标。</strong><p>从全球变化中，发现下一次对话的起点。</p></div>
  </aside>
  <main id="world-content">
    <header class="world-topbar"><div>工作空间 <span>/</span> 世界消息</div><a href="/#home">返回工作台 <span aria-hidden="true">↗</span></a></header>
    <div class="world-page">
      <div class="world-heading"><div><p class="eyebrow">GLOBAL INDUSTRY SIGNALS</p><h1>世界正在发生什么？</h1><p class="world-subtitle">把行业变化放到地图上，找到与你相关的下一条消息。</p></div><div class="world-feed-state"><span></span>演示模式 · 实时推送尚未接入</div></div>
      <p id="world-error" class="world-error" role="alert" hidden></p>
      <p id="world-status" class="sr-only" role="status" aria-live="polite"></p>
      <section id="world-explorer" aria-label="行业消息探索">
        <div class="world-toolbar"><div id="industry-filters" class="industry-filters" role="group" aria-label="按行业筛选"></div><button id="demo-push" class="secondary" type="button"><span aria-hidden="true">＋</span>模拟一条推送</button></div>
        <div class="world-layout">
          <section class="world-map-card" aria-label="消息地图">
            <div class="map-caption"><div><span class="map-cross" aria-hidden="true">⊕</span><strong>全球视野</strong><span id="map-count">加载地图中…</span></div><button id="reset-map" type="button" aria-label="重置到全球地图">全球视图 ↗</button></div>
            <div id="world-map" aria-label="可缩放的世界消息地图"></div>
            <div id="map-loading" class="map-loading" role="status">正在载入世界地图…</div>
            <div class="map-bottom"><span><i class="legend-dot"></i>点击气泡查看摘要 · 再次点击进入详情</span><span>滚轮缩放 / 拖动浏览</span></div>
          </section>
          <aside id="news-panel" class="news-panel" aria-label="消息摘要与列表"></aside>
        </div>
        <div class="world-footer"><div class="world-metrics"><span><strong id="news-total">—</strong> 条消息</span><span><strong id="location-total">—</strong> 个地点</span><span><strong id="industry-total">—</strong> 个行业</span></div><p>当前内容均为虚构演示，用于预览交互，不代表真实新闻。</p></div>
      </section>
      <section id="news-detail" class="news-detail" aria-label="消息详情" hidden></section>
      <noscript><p class="world-error">请启用 JavaScript 后查看地图和消息。</p></noscript>
    </div>
  </main>
</body>
</html>
