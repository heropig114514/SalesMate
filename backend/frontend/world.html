<!DOCTYPE html>

<!-- 职责：提供全球活动地图、联动活动详情、行业资讯和独立详情地址的页面骨架。
实现：Leaflet 绘制真实地理底图和数据库商机，world-news.js 管理活动筛选、日历下载与邀约草稿；虚拟来源逐条明确展示。
关联：聊天 Markdown 模块依赖使用统一缓存版本；0919 界面及共享语言资源统一缓存版本；共享语言/API 资源随需求界面统一版本；入口脚本版本随工作空间聊天升级；assistant-widget.js/css 提供底部条状助手；product-header.js 提供共享顶栏，design-system.css 提供 Nocturne 设计变量；后端存储并验证资讯；world-map.js 绘制气泡；Django 的 /world/ 与 /world/news/<id>/ 共用模板。
目录：无函数或类；workspace-profile 为底部公司与邮箱设置，world-map 地图、event-detail 活动详情、industry-news 资讯、news-detail 文章、world-status 无障碍状态、world-error 错误提示。
国际化：data-i18n 标记静态文本与属性；language-bar 提供语言选择，i18n.js 初始化时只翻译标记节点，选项显式 value 保持原协议值。
变量索引：无脚本变量；活动筛选与联动 DOM 由页面模块维护。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="dark" name="color-scheme"/><title data-i18n="世界消息 · SalesMate">世界消息 · SalesMate</title>
<link href="/static/design-system.css?v=20260921-product" rel="stylesheet"/>
<link href="/static/app.css?v=20260921-product" rel="stylesheet"/>
<link href="/static/assistant-widget.css?v=20260921-markdown" rel="stylesheet"/>
<link href="/static/workspace.css?v=20260921-product" rel="stylesheet"/>
<link href="/static/vendor/leaflet-1.9.4/leaflet.css" rel="stylesheet"/>
<link href="/static/world-news.css?v=20260920-requirements" rel="stylesheet"/>
<script defer="" src="/static/vendor/leaflet-1.9.4/leaflet.js"></script>
<script type="module" src="/static/world-news.js?v=20260922-support"></script>
<script type="module" src="/static/i18n.js?v=20260921-product"></script></head>
<body class="world-workspace"><div class="language-bar"><label for="interface-language"><span data-i18n="界面语言">界面语言</span></label><select aria-label="界面语言" data-i18n-aria-label="界面语言" id="interface-language"><option data-i18n="跟随系统" value="auto">跟随系统</option><option value="zh-hans">简体中文</option><option value="en">English</option></select></div>
<a class="world-skip" href="#world-content"><span data-i18n="跳到世界消息">跳到世界消息</span></a>
<salesmate-header></salesmate-header>
<aside class="workspace-shell">
<div class="workspace-brand-label">WORKSPACE<span><span data-i18n="我的工作空间">我的工作空间</span></span></div>
<nav aria-label="主导航" data-i18n-aria-label="主导航" id="workspace-nav"></nav>
<div class="world-sidebar-note"><span aria-hidden="true" class="world-orbit">◎</span><strong><span data-i18n="让每条消息，有业务坐标。">让每条消息，有业务坐标。</span></strong><p><span data-i18n="从全球变化中，发现下一次对话的起点。">从全球变化中，发现下一次对话的起点。</span></p></div>
<nav class="workspace-profile" aria-label="Profile" id="workspace-profile"></nav>
</aside>
<main id="world-content">
<div class="insights-heading"><div><p class="eyebrow">GLOBAL INSIGHTS</p><h1 data-i18n="全球洞察">全球洞察</h1><p data-i18n="这个季度，该去哪里见客户？">这个季度，该去哪里见客户？</p></div><span class="insights-demo" id="world-data-status">正在读取数据库…</span><a href="/priorities/">商机优先级 ↗</a></div>
<p id="world-error" role="alert" hidden></p><p id="world-status" class="sr-only" role="status"></p>
<section id="world-explorer">
<div class="insights-toolbar"><div><label for="event-type" data-i18n="活动类型">活动类型</label><select id="event-type"><option value="all" data-i18n="全部类型">全部类型</option><option value="exhibition" data-i18n="展会">展会</option><option value="sales" data-i18n="销售活动">销售活动</option></select><label for="event-time" data-i18n="时间窗">时间窗</label><select id="event-time"><option value="all" data-i18n="全部时间">全部时间</option><option value="30" data-i18n="30 天内">30 天内</option><option value="quarter" data-i18n="本季度">本季度</option></select></div><label>地图币种 <select id="map-currency"></select></label></div>
<div class="insights-layout"><aside class="events-sidebar"><div class="events-heading"><h2 data-i18n="值得见面的地方">值得见面的地方</h2><span class="count-pill" id="event-count">0</span></div><div id="region-filters" class="region-filters" role="group" aria-label="地区" data-i18n-aria-label="地区"></div><div id="event-list"></div></aside>
<section class="insights-map-panel" aria-label="活动地图" data-i18n-aria-label="活动地图"><div class="map-topline"><span id="map-count"></span><div id="map-views" role="group" aria-label="地图视角" data-i18n-aria-label="地图视角"><button type="button" data-view="global" aria-pressed="true" data-i18n="全球">全球</button><button type="button" data-view="apac" aria-pressed="false" data-i18n="亚太">亚太</button><button type="button" data-view="europe" aria-pressed="false" data-i18n="欧洲">欧洲</button></div></div><div id="world-map" aria-label="可缩放的活动地图" data-i18n-aria-label="可缩放的活动地图"></div><div class="map-legend"><span><i class="legend-bubble"></i><span data-i18n="圆点大小 = 当地在手商机金额">圆点大小 = 当地在手商机金额</span></span><span><i class="legend-country"></i><span data-i18n="高亮 = 有在跟客户">高亮 = 有在跟客户</span></span></div><p class="map-demo-note" id="map-note"></p></section>
<aside id="event-detail" class="event-detail" aria-label="活动详情" data-i18n-aria-label="活动详情" aria-live="polite"></aside></div>
<section class="industry-section"><div class="industry-section-heading"><div><p class="eyebrow">INDUSTRY BRIEFING</p><h2 data-i18n="行业资讯">行业资讯</h2></div><span data-i18n="近 14 天">近 14 天</span></div><div id="industry-news"></div></section>
</section><section id="news-detail" class="news-detail" hidden></section>
<dialog id="invite-dialog"><div class="invite-heading"><h2 data-i18n="客户邀约草稿">客户邀约草稿</h2><button type="button" id="invite-close" aria-label="关闭" data-i18n-aria-label="关闭">×</button></div><p class="muted" data-i18n="请核对并修改后自行发送，不会自动发出邮件。">请核对并修改后自行发送，不会自动发出邮件。</p><label for="invite-subject" data-i18n="邮件主题">邮件主题</label><input id="invite-subject"><label for="invite-body" data-i18n="邮件正文">邮件正文</label><textarea id="invite-body" rows="12"></textarea><button type="button" id="invite-copy" class="primary" data-i18n="复制草稿">复制草稿</button><p id="invite-status" role="status"></p></dialog>
</main></body></html>
