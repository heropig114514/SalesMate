# Responsibility: Specify an isolated writable geocoding-cache directory for Global Insights collection.
# Implementation: Override the Agent service cache path while the parent shared directory remains root-managed and its overall permissions are not relaxed.
# Relationships: An administrator precreates a salesmate:salesmate 0700 subdirectory and installs this as service.d/cache.conf. Agent code and collection conditions do not change.
# Directory:
# - None
# Variable index:
# - SALESMATE_WORLD_GEO_CACHE: Collection-service-exclusive cache path that supports same-directory temporary files and atomic replacement.
[Service]
Environment=SALESMATE_WORLD_GEO_CACHE=/opt/salesmate/shared/world-insights/world-geocodes.json
