# 职责：为全球洞察采集服务指定独立可写的地理编码缓存目录。
# 实现：覆盖 Agent service 的缓存路径；父 shared 目录继续保持 root 管理，不放宽整个目录权限。
# 关联：管理员预建 salesmate:salesmate 0700 子目录，并安装为 service.d/cache.conf；Agent 代码和采集条件不变。
# 目录：无函数或类。
# 变量索引：SALESMATE_WORLD_GEO_CACHE 为采集服务独占缓存路径，支持同目录临时文件及原子替换。
[Service]
Environment=SALESMATE_WORLD_GEO_CACHE=/opt/salesmate/shared/world-insights/world-geocodes.json
