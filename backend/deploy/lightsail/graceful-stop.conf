# Responsibility: Let background Workers finish current work before exit during deployment.
# Implementation: Send SIGTERM and disable systemd's post-timeout forced termination; management commands drain in-flight units.
# Relationships: Installed in both salesmate-crm.service.d and salesmate-sales.service.d.
# Directory:
# - None
# Variable index:
# - KillSignal: Stop signal.
# - TimeoutStopSec: Allows in-flight work of any duration to complete.
[Service]
KillSignal=SIGTERM
TimeoutStopSec=infinity
