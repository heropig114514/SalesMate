# Responsibility: Provide HTTPS and ACME entry points for milkdragon.dev.
# Implementation: Select certificates by domain; business and static resources use the same verified release snippet.
# Relationships: Gunicorn dual-instance releases and the existing Certbot renewal service.
# Directory:
# - None
# Variable index:
# - server_name: Domain name.
# - ssl_certificate/ssl_certificate_key: Certificate paths.
# - client_max_body_size: Existing 25 MiB limit.
server {
    listen 80;
    listen [::]:80;
    server_name milkdragon.dev;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://milkdragon.dev$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name milkdragon.dev;
    ssl_certificate /etc/letsencrypt/live/milkdragon.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milkdragon.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    include /etc/nginx/snippets/salesmate-release.conf;
}
