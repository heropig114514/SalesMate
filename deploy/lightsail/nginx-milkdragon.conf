# 职责：为 milkdragon.dev 提供 HTTPS 与 ACME 入口。
# 实现：证书按域名选择；业务与静态资源使用同一个已验证发布片段。
# 关联：Gunicorn 双实例发布和现有 Certbot 续期服务。
# 目录：无函数或类。
# 变量索引：server_name 为域名；ssl_certificate/ssl_certificate_key 为证书路径；client_max_body_size 为原有 25 MiB 上限。
server {
    listen 80;
    listen [::]:80;
    server_name milkdragon.dev;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://milkdragon.dev$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name milkdragon.dev;
    ssl_certificate /etc/letsencrypt/live/milkdragon.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milkdragon.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    include /etc/nginx/snippets/salesmate-release.conf;
}
