# 职责：提供简易部署的 HTTPS 入口、证书验证路径和前端静态资源。
# 实现：HTTP 仅提供 ACME 验证并将其他请求重定向至 HTTPS，业务代理至回环 ASGI 服务。
# 关联：salesmate-web.service、IP 证书和续期服务；部署前须先签发证书。
# 目录：无函数或类。
# 变量索引：server_name 为服务器 IP；ssl_certificate 为证书路径；client_max_body_size 为 25 MiB 请求上限（应用附件上限仍为 20 MiB）。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.131.232.143;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://47.131.232.143$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 47.131.232.143;
    ssl_certificate /etc/letsencrypt/live/salesmate-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salesmate-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    location /static/ {
        alias /opt/salesmate/app/backend/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
