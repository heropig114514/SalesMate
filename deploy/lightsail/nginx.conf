# 职责：提供简易部署的 HTTPS 入口、证书验证路径和前端静态资源。
# 实现：HTTP 提供 ACME 验证并重定向至 HTTPS，业务和静态路径由已验证发布片段提供。
# 关联：salesmate-web@.service、IP 证书和续期服务；须先初始化发布片段。
# 目录：无函数或类。
# 变量索引：server_name 为服务器 IP；ssl_certificate 为证书路径；client_max_body_size 为 25 MiB 请求上限（应用附件上限仍为 20 MiB）。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.131.232.143;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://47.131.232.143$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 47.131.232.143;
    ssl_certificate /etc/letsencrypt/live/salesmate-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salesmate-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    include /etc/nginx/snippets/salesmate-release.conf;
}
