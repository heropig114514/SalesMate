# Responsibility: Provide HTTPS entry, certificate-verification path, and frontend static resources for simple deployment.
# Implementation: HTTP serves ACME validation and redirects to HTTPS; the verified release snippet provides business and static paths.
# Relationships: salesmate-web@.service, IP certificate, and renewal service. Initialize the release snippet first.
# Directory:
# - None
# Variable index:
# - server_name: Server IP.
# - ssl_certificate: Certificate path.
# - client_max_body_size: 25 MiB request limit; application attachment limit remains 20 MiB.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.131.232.143;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://47.131.232.143$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 47.131.232.143;
    ssl_certificate /etc/letsencrypt/live/salesmate-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salesmate-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    include /etc/nginx/snippets/salesmate-release.conf;
}
