# Responsibility: Check the staged backend Python snapshot before commit.
# Implementation: A local Python hook runs the unified checker; errors block the commit while semantic-review findings are advisory.
# Relationships: backend/tools/check_doc_changes.py; activate with pre-commit install.
# Directory:
# - backend-docs: Staged-snapshot checking hook.
# Variable index:
# - entry: Checker entry point.
# - pass_filenames: Disables per-file arguments to inspect the complete staged snapshot.
repos:
  - repo: local
    hooks:
      - id: backend-docs
        name: backend documentation (staged snapshot)
        entry: python backend/tools/check_doc_changes.py --staged
        language: python
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-commit]
